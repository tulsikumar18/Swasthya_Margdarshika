{% extends "base.html" %}

{% block title %}Contact | Personalized Medical Recommendation System{% endblock %}

{% block content %}
<div class="py-5">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="text-center mb-4">
                    <span class="neu-btn text-primary py-1 px-3 mb-3" style="font-size: 0.85rem;">Get in Touch</span>
                    <h1 class="fw-bold mb-2">Feedback & Support</h1>
                    <p class="text-secondary lead">
                        Have questions about the algorithm, dataset integrity, or API integration? Send us your inquiries.
                    </p>
                </div>

                <div class="neu-card p-4 p-md-5">
                    <form onsubmit="event.preventDefault(); alert('Thank you for your message! Our team will get back to you shortly.'); this.reset();">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary small text-uppercase ps-2">Your Name</label>
                                <input type="text" class="neu-input" required placeholder="John Doe">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary small text-uppercase ps-2">Email Address</label>
                                <input type="email" class="neu-input" required placeholder="john@example.com">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small text-uppercase ps-2">Subject</label>
                            <input type="text" class="neu-input" required placeholder="API Inquiries, feedback, or suggestions">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small text-uppercase ps-2">Message</label>
                            <textarea class="neu-textarea" rows="4" required placeholder="Write your message here..."></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="neu-btn neu-btn-action py-3 fs-6">
                                <i class="fas fa-paper-plane me-2"></i> Submit Inquiry
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
